{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>All User Tasks</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2>All Users' Tasks</h2>
    <table class="table table-striped mt-4">
        <thead>
            <tr>
                <th>User</th>
                <th>Task</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Due Date</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
            <tr>
                <td>{{ task.assigned_to.name }}</td>
                <td>{{ task.title }}</td>
                <td>{{ task.priority }}</td>
                <td>{{ task.status }}</td>
                <td>{{ task.due_date }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">No tasks available</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
