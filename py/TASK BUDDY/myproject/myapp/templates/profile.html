{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBuddy - Profile</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <!-- Profile Card -->
      <div class="card shadow-lg p-4 text-center">
        <!-- Avatar -->
        <div class="mb-3">
          {% if myuser.profile.url %}
            <img src="{{myuser.profile.url}}" alt="Profile" class="rounded-circle" width="120" height="120">
          {% else %}
            <img src="{% static '#' %}" alt="Profile" class="rounded-circle" width="120" height="120">
          {% endif %}
        </div>

        <!-- Info -->
        <h4 class="mb-1">{{myuser.name}}</h4>
        <p class="text-muted mb-3">{{ myuser.email }}</p>
        <span class="badge bg-primary">{{ user.profile.role|title }}</span>

        <!-- Update Button -->
        <button class="btn btn-outline-primary mt-3" data-bs-toggle="modal" data-bs-target="#editProfileModal">
          <i class="fa fa-edit"></i> Edit Profile
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Edit Profile Modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form action="{% url 'profile' %}" method="POST"  enctype="multipart/form-data">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title">Update Profile</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <!-- Username -->
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="name" class="form-control" value="{{ myuser.name }}">
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ myuser.email }}" readonly>
          </div>

          <!-- Avatar -->
          <div class="mb-3">
            <label class="form-label">Profile Image</label>
            <input type="file" name="profile" class="form-control">
          </div>

          <!-- Role (readonly for users) -->
          <div class="mb-3">
            <label class="form-label">Role</label>
            <input type="text" class="form-control" value="{{myuser.selection}}" readonly>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
