{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add / Edit Task - TaskBuddy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow p-4">
        <h3 class="mb-4 text-center">➕ Add / Edit Task</h3>

        <form action="{% url 'task' %}" method="POST">
          {% csrf_token %}
          
          <!-- Task Title -->
          <div class="mb-3">
            <label class="form-label">Task Title</label>
            <input type="text" name="title" class="form-control" placeholder="Enter task title" required>
          </div>

          <!-- Description -->
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" rows="3" class="form-control" placeholder="Write task details"></textarea>
          </div>

          <!-- Priority -->
          <div class="mb-3">
            <label class="form-label">Priority</label>
            <select name="priority" class="form-select">
              <option value="High" class="text-danger">High</option>
              <option value="Medium" class="text-primary">Medium</option>
              <option value="Low" class="text-success">Low</option>
            </select>
          </div>

          <!-- Status -->
          <div class="mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>

          <!-- Due Date -->
          <div class="mb-3">
            <label class="form-label">Due Date</label>
            <input type="date" name="due_date" class="form-control">
          </div>

          <!-- Assign To -->
          <div class="mb-3">
            <label class="form-label">Assign To</label>
            <select name="assigned_to" class="form-select">
              {% for member in team_members %}
                <option value="{{ member.id }}">{{ member.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="d-flex justify-content-between">
            <a href="{% url 'index' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Task</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
