{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Task</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h3 class="mb-3 text-danger">Delete Task</h3>
            <p>Are you sure you want to delete this task?</p>

            <ul class="list-group mb-3">
                <li class="list-group-item"><strong>Task:</strong> {{ task.title }}</li>
                <li class="list-group-item"><strong>Priority:</strong> {{ task.priority }}</li>
                <li class="list-group-item"><strong>Status:</strong> {{ task.status }}</li>
                <li class="list-group-item"><strong>Due Date:</strong> {{ task.due_date }}</li>
            </ul>

            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a href="{% url 'index' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>

</body>
</html>
